plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-parcelize'
    id "org.jlleitschuh.gradle.ktlint"
    id 'org.openapi.generator' version '6.6.0'
}

android {
    namespace "com.droidbaza.spotifycompose"
    compileSdk 34

    defaultConfig {
        applicationId "com.droidbaza.spotifycompose"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "String", "BASE_URL", '"https://api.spotify-clone.com/api/v1/"'
        }
        debug {
            minifyEnabled false
            buildConfigField "String", "BASE_URL", '"https://1cfa5e41c4c9.ngrok-free.app/api/v1/"'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    composeOptions {
        kotlinCompilerExtensionVersion "1.5.4"
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
            // Exclude common duplicate license/notice files that can appear from test
            // dependencies (JUnit Jupiter, etc.) when building androidTest APKs.
            excludes += 'META-INF/LICENSE.md'
            excludes += 'META-INF/LICENSE'
            excludes += 'META-INF/NOTICE'
        }
    }
}

dependencies {
    // Core Android
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    
    // Compose
    implementation platform('androidx.compose:compose-bom:2023.10.01')
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.material:material"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.compose.material:material-icons-extended"
    implementation "androidx.compose.foundation:foundation"
    implementation "androidx.compose.ui:ui-test-manifest"
    
    // Navigation
    implementation "androidx.navigation:navigation-compose:$navigation_version"
    implementation "androidx.constraintlayout:constraintlayout-compose:1.0.1"

    // Architecture Components
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.6.2'
    implementation 'androidx.activity:activity-compose:1.8.0'
    
    // Images & UI
    implementation 'androidx.palette:palette-ktx:1.0.0'
    implementation "io.coil-kt:coil-compose:2.5.0"

    // Networking
    implementation "com.squareup.retrofit2:retrofit:2.9.0"
    implementation "com.squareup.okhttp3:okhttp:4.11.0"
    implementation "com.squareup.okhttp3:logging-interceptor:4.11.0"
    implementation "com.squareup.retrofit2:converter-gson:2.9.0"
    implementation "com.squareup.retrofit2:converter-scalars:2.9.0"
    implementation "com.google.code.gson:gson:2.10.1"

    // Coroutines
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutines_version"
    implementation "androidx.datastore:datastore-preferences:1.0.0"
    
    // Testing
    testImplementation 'junit:junit:4.13.2'
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:$coroutines_version"
    testImplementation 'io.mockk:mockk:1.13.8'
    testImplementation "app.cash.turbine:turbine:1.0.0"
    testImplementation "com.squareup.okhttp3:mockwebserver:4.11.0"
    testImplementation 'androidx.test:core:1.5.0'
    testImplementation 'org.robolectric:robolectric:4.10.3'
    
    // Android Testing
    androidTestImplementation platform('androidx.compose:compose-bom:2023.10.01')
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation "androidx.compose.ui:ui-test-junit4"
    androidTestImplementation 'androidx.test:core-ktx:1.5.0'
    androidTestImplementation "com.squareup.okhttp3:mockwebserver:4.11.0"
    // mockk-android pulls some junit-jupiter artifacts transitively which are not needed
    // for android instrumentation tests and can cause duplicate META-INF files.
    androidTestImplementation("io.mockk:mockk-android:1.13.8") {
        exclude group: 'org.junit.jupiter'
    }
    
    // Debug
    debugImplementation "androidx.compose.ui:ui-tooling"
    debugImplementation "androidx.compose.ui:ui-test-manifest"
}

// OpenAPI Generator configuration - generates Kotlin + Retrofit2 (Gson) client
openApiGenerate {
    generatorName = "kotlin"
    inputSpec = "${projectDir}/src/main/openapi/api-docs.json"
    outputDir = "${buildDir}/generated/openapi"
    apiPackage = "com.droidbaza.spotifycompose.network.generated.api"
    modelPackage = "com.droidbaza.spotifycompose.network.generated.model"
    packageName = "com.droidbaza.spotifycompose.network.generated"
    configOptions = [
        dateLibrary: "string",
        useCoroutines: "true",
        serializationLibrary: "gson",
        library: "jvm-retrofit2"
    ]
}

android.sourceSets.main.java.srcDirs += "${buildDir}/generated/openapi/src/main/kotlin"