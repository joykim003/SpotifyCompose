plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-parcelize'
    id "org.jlleitschuh.gradle.ktlint"
}

android {
    namespace "com.droidbaza.spotifycompose"
    compileSdk 34

    defaultConfig {
        applicationId "com.droidbaza.spotifycompose"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    composeOptions {
        kotlinCompilerExtensionVersion "1.5.4"
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
            // Exclude common duplicate license/notice files that can appear from test
            // dependencies (JUnit Jupiter, etc.) when building androidTest APKs.
            excludes += 'META-INF/LICENSE.md'
            excludes += 'META-INF/LICENSE'
            excludes += 'META-INF/NOTICE'
        }
    }
}

dependencies {
    // Core Android
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    
    // Compose
    implementation platform('androidx.compose:compose-bom:2023.10.01')
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.material:material"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.compose.material:material-icons-extended"
    implementation "androidx.compose.foundation:foundation"
    implementation "androidx.compose.ui:ui-test-manifest"
    
    // Navigation
    implementation "androidx.navigation:navigation-compose:$navigation_version"
    implementation "androidx.constraintlayout:constraintlayout-compose:1.0.1"

    // Architecture Components
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.6.2'
    implementation 'androidx.activity:activity-compose:1.8.0'
    
    // Images & UI
    implementation 'androidx.palette:palette-ktx:1.0.0'
    implementation "io.coil-kt:coil-compose:2.5.0"

    // Coroutines
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutines_version"
    
    // Testing
    testImplementation 'junit:junit:4.13.2'
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:$coroutines_version"
    testImplementation 'io.mockk:mockk:1.13.8'
    testImplementation "app.cash.turbine:turbine:1.0.0"
    
    // Android Testing
    androidTestImplementation platform('androidx.compose:compose-bom:2023.10.01')
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation "androidx.compose.ui:ui-test-junit4"
    // mockk-android pulls some junit-jupiter artifacts transitively which are not needed
    // for android instrumentation tests and can cause duplicate META-INF files.
    androidTestImplementation("io.mockk:mockk-android:1.13.8") {
        exclude group: 'org.junit.jupiter'
    }
    
    // Debug
    debugImplementation "androidx.compose.ui:ui-tooling"
    debugImplementation "androidx.compose.ui:ui-test-manifest"
}